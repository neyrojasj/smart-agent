# Smart - Skill Registry
# ═════════════════════════════════════════════════════════════════════════
# This file defines all available skills and their routing rules.
# Smart reads this to route requests in Light or Full mode.
# Light mode: analysis, documentation, setup, skill-generator, glossary (direct execution)
# Full mode: ddd → tdd → planning → plan-reviewer → coding → evaluator (iterative loop)
# Fix mode: fix → ddd (update) → tdd (update) → planning → coding
# ═══════════════════════════════════════════════════════════════════════════

version: 4
last_updated: "2026-05-05T00:00:00Z"

skills:
  glossary:
    file: "glossary/SKILL.md"
    name: "Glossary"
    description: "Manage project glossary (GLO) — acronyms and terms used to minimize context window usage. Read by ALL skills before routing."
    priority: 0
    triggers:
      keywords:
        - glossary
        - terms
        - acronyms
        - add term
        - what does
        - GLO
      patterns:
        - "add.*to glossary"
        - "update glossary"
        - "show glossary"
        - "what does.*mean"
    requires_approval: false
    can_chain_to: []

  ddd:
    file: "ddd/SKILL.md"
    name: "DDD"
    description: "Design Driven Development — challenge user, produce AI-readable DES with @tagged MODs and IFCs. Fewer files, interfaces mandatory for cross-MOD calls."
    priority: 1
    triggers:
      keywords:
        - DDD
        - design
        - architect
        - interface
        - module
        - structure
        - boundaries
      patterns:
        - "design.*for"
        - "define.*interface"
        - "how.*should.*structured"
        - "DDD.*"
        - "create.*design"
    requires_approval: true
    can_chain_to:
      - tdd
      - planning

  tdd:
    file: "tdd/SKILL.md"
    name: "TDD"
    description: "Test Driven Development — write tests before implementation, derived from DES IFCs. All tests RED until coding skill makes them GREEN."
    priority: 2
    triggers:
      keywords:
        - TDD
        - test first
        - write tests
        - tests before
        - test driven
      patterns:
        - "TDD.*"
        - "write tests for.*"
        - "tests.*before.*impl"
        - "test.*DESIGN"
        - "tests.*IFC"
    requires_approval: false
    can_chain_to:
      - planning

  planning:
    file: "planning/SKILL.md"
    name: "Planning"
    description: "Creates PLAN + KF. When DES and TST exist, derives phases from MODs/IFCs/test matrix — no re-design. All plans written to disk."
    priority: 3
    triggers:
      keywords:
        - plan
        - PLAN
        - approach
        - strategy
        - roadmap
        - proposal
      patterns:
        - "create a plan"
        - "plan.*implementation"
        - "what's the best approach"
        - "help me think through"
    requires_approval: true
    can_chain_to:
      - coding
      - testing

  fix:
    file: "fix/SKILL.md"
    name: "Fix"
    description: "Fix issues — reads GLO+DES+TST, classifies fix, updates DES/TST if needed, then creates PLAN via planning skill."
    priority: 4
    triggers:
      keywords:
        - fix
        - bug
        - broken
        - failing
        - error
        - regression
        - patch
        - incorrect
      patterns:
        - "fix.*bug"
        - "tests.*failing"
        - "broken.*"
        - "regression.*in"
        - "error.*in"
        - "update.*to.*do"
    requires_approval: true
    can_chain_to:
      - ddd
      - tdd
      - planning

  plan-reviewer:
    file: "plan-reviewer/SKILL.md"
    name: "Plan Reviewer"
    description: "Reviews plans via adversarial critique and generates QA checklists. Pre-execution quality gate."
    priority: 5
    triggers:
      keywords:
        - review plan
        - critique plan
        - curate plan
        - qa checklist
      patterns:
        - "review.*plan"
        - "critique.*plan"
        - "generate.*qa"
        - "generate.*checklist"
    requires_approval: false
    can_chain_to:
      - planning
      - evaluator

  coding:
    file: "coding/SKILL.md"
    name: "Coding"
    description: "Generates and modifies code following standards"
    priority: 2
    triggers:
      keywords:
        - implement
        - code
        - create
        - add
        - modify
        - fix
        - refactor
        - build
        - develop
      patterns:
        - "implement.*"
        - "add.*feature"
        - "fix.*bug"
        - "refactor.*"
        - "create.*function"
        - "build.*"
    requires_approval: true
    can_chain_to:
      - testing
      - documentation

  analysis:
    file: "analysis/SKILL.md"
    name: "Analysis"
    description: "Analyzes code, performs audits, debugging, and explanations"
    priority: 3
    triggers:
      keywords:
        - analyze
        - audit
        - review
        - debug
        - explain
        - why
        - how
        - understand
        - investigate
      patterns:
        - "explain.*"
        - "why does.*"
        - "what.*doing"
        - "audit.*"
        - "review.*code"
        - "help me understand"
        - "what's wrong with"
    requires_approval: false
    can_chain_to:
      - planning
      - coding

  documentation:
    file: "documentation/SKILL.md"
    name: "Documentation"
    description: "Generates and updates project documentation"
    priority: 4
    triggers:
      keywords:
        - document
        - docs
        - readme
        - api
        - comments
        - jsdoc
        - docstring
      patterns:
        - "document.*"
        - "update.*docs"
        - "write.*readme"
        - "add.*comments"
        - "generate.*documentation"
    requires_approval: false
    can_chain_to:
      - analysis

  testing:
    file: "testing/SKILL.md"
    name: "Testing"
    description: "Creates tests, manages coverage, and validates code"
    priority: 5
    triggers:
      keywords:
        - test
        - coverage
        - spec
        - mock
        - fixture
        - unit
        - integration
        - e2e
      patterns:
        - "write.*test"
        - "add.*tests"
        - "test.*coverage"
        - "create.*spec"
        - "mock.*"
    requires_approval: false
    can_chain_to:
      - coding

  setup:
    file: "setup/SKILL.md"
    name: "Setup"
    description: "Project initialization — scan codebase, create context, generate docs"
    priority: 6
    triggers:
      keywords:
        - setup
        - initialize
        - init
        - configure
        - install
        - bootstrap
        - scaffold
      patterns:
        - "setup.*project"
        - "initialize.*"
        - "configure.*"
        - "scan.*project"
    requires_approval: false
    can_chain_to:
      - skill-generator
      - documentation

  skill-generator:
    file: "skill-generator/SKILL.md"
    name: "Skill Generator"
    description: "Detect project patterns and generate custom skills on demand"
    priority: 7
    triggers:
      keywords:
        - generate skills
        - create skill
        - rescan
        - regenerate skills
        - skill opportunities
      patterns:
        - "generate.*skills"
        - "create.*skill"
        - "rescan.*project"
        - "regenerate.*skills"
    requires_approval: false
    can_chain_to:
      - documentation

  evaluator:
    file: "evaluator/SKILL.md"
    name: "Evaluator"
    description: "Evaluate implementations against QA checklists (evaluate mode) and extract post-execution learnings (learning mode)"
    priority: 8
    triggers:
      keywords:
        - evaluate
        - assess
        - qa
        - quality check
        - auto-improve
        - iterate
      patterns:
        - "evaluate.*implementation"
        - "check.*quality"
        - "auto.?improve"
        - "iterate.*until"
        - "improve.*until.*pass"
    requires_approval: false
    can_chain_to:
      - coding
      - testing

  ui-ux:
    file: "ui-ux/SKILL.md"
    name: "UI/UX"
    description: "Generate a project design system and produce a persistent ui-style skill for all future UI coding. Runs once per project unless the user requests a style change."
    priority: 9
    triggers:
      keywords:
        - web page
        - webpage
        - landing page
        - ui
        - ux
        - design
        - style
        - frontend
        - layout
        - component
        - redesign
        - restyle
        - color palette
        - typography
        - design system
      patterns:
        - "create.*page"
        - "build.*page"
        - "build.*ui"
        - "design.*app"
        - "create.*component"
        - "style.*application"
        - "change.*style"
        - "update.*design"
        - "set.*style"
        - "define.*design"
    requires_approval: true
    idempotent: true
    idempotency_check: ".github/skills/ui-style/SKILL.md"
    produces: "ui-style"
    can_chain_to:
      - coding
      - planning
    notes: >
      Runs ONCE per project. On subsequent UI requests, checks for existing
      ui-style/SKILL.md and skips re-generation unless user explicitly requests
      a style change. Requires user to authorize use of the external
      ui-ux-pro-max library (cloned at .github/copilot/external/ui-ux-pro-max-skill/).

  rust-web-app:
    file: "rust-web-app/SKILL.md"
    name: "Rust Web App"
    description: "Scaffold a production-ready Rust web application with Axum, Tokio, SQLx, and PostgreSQL."
    priority: 10
    triggers:
      keywords:
        - rust web app
        - axum
        - scaffold rust
        - new rust
      patterns:
        - "new rust.*api"
        - "scaffold.*rust"
        - "setup.*rust.*project"
        - "create.*rust.*web"
        - "rust.*web.*app"
    requires_approval: false
    can_chain_to:
      - setup
      - coding

# Routing configuration
routing:
  # Default skill when no clear match
  default_skill: analysis

  # Minimum skill version compatible with this orchestrator
  min_skill_version: "1.0"

  # Confidence tiers: high (clear match), medium (partial), low (weak - ask user)
  confidence_model: "tiered"

  # Require capability/context adequacy check even when a skill matches keywords
  context_adequacy_required: true
  
  # Allow invoking multiple skills for complex requests
  multi_skill_enabled: true
  
  # Maximum skills per single request
  max_skills_per_request: 3

# Fallback behavior
fallback:
  # What to do when no skill matches
  no_match: "analysis"

  # For change/implementation requests with no match:
  # generate_missing_skill => route to skill-generator, then reroute
  no_match_for_change: "generate_missing_skill"

  # For requests where a skill matched keywords but lacks subtype/context coverage:
  # enforce_skill_generation => route to skill-generator, then reroute
  matched_but_inadequate: "enforce_skill_generation"

  # When confidence tier is LOW:
  # ask_user => notify user, ask to proceed or refine, log outcome in session.md
  low_confidence: "ask_user"

  # Path used to track deferred skill gaps
  skill_gap_registry: ".github/copilot/docs/skills-opportunities.md"
  
  # What to do when multiple skills match equally
  ambiguous: "ask_user"

# Skill chaining rules
chaining:
  # Whether to automatically chain skills
  auto_chain: true
  
  # Common chains (ordered sequences)
  common_chains:
    feature_development:
      - planning
      - coding
      - testing
      - documentation
    
    bug_fix:
      - analysis
      - coding
      - testing
    
    code_review:
      - analysis
      - documentation
