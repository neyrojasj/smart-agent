    "Given the weft skill body is loaded, then it contains the complete weft command reference (verify, check, bump, seal, init, new, list, get, deprecate, render, annotate, trace).",
    "Given the weft skill body is loaded, then it contains the correct @addresses, @implements, and @verifies annotation format with REQ_ID, version, and hash.",
