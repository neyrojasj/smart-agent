id = "REQ-004"
version = 2
feat = "FEAT-Records"
hash = "7766a56e"
status = "active"
statement = "The system must compute and store a short content hash over each requirement's normative region (statement and acceptance criteria)."
acceptance = [
    "Given a requirement record, when the statement and acceptance values are read, then the stored hash equals the first 8 hex characters of the SHA-256 over the NFC-normalised canonical serialisation of those fields.",
    "Given the statement or any acceptance item changes, then the derived hash differs from the previous stored hash.",
    "Given only rationale or notes change, then the derived hash is unchanged.",
]
rationale = "The hash makes silent edits detectable and lets trace annotations pin an exact requirement revision."
