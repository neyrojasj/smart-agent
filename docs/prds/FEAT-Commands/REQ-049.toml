id = "REQ-049"
version = 2
feat = "FEAT-Commands"
hash = "a5273df5"
status = "active"
statement = "The CONTEXT.md generated by weft init must be pre-filled with mandatory weft conventions: the weft skill as the entry point for all weft activity, .scratch/ folder usage for issues and PRDs, docs/adr/ and docs/decisions/ hierarchy, and a pointer to each installed skill and its trigger."
acceptance = [
    "Given weft init generates CONTEXT.md, then it contains a section directing the agent to load the weft skill for any requirements-related activity.",
    "Given weft init generates CONTEXT.md, then it documents .scratch/ as the issue tracker location with its subdirectory conventions.",
    "Given weft init generates CONTEXT.md, then it documents docs/adr/ for architecture decision records and docs/decisions/ for design decisions.",
    "Given weft init generates CONTEXT.md, then it lists each installed skill with its trigger so the agent knows when to load each one.",
    "Given CONTEXT.md already exists at the project root, then weft init does not overwrite it and exits 0.",
]
rationale = "CONTEXT.md is the always-loaded project context file. Without pre-filled weft conventions, agents in a freshly initialised project will not know the mandatory workflows."
