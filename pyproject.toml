[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartagent"
version = "0.1.0"
description = "CLI tool to install and manage Smart Copilot skills and personal branch sync"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
smart = "smartagent.cli:main"

[project.urls]
Homepage = "https://github.com/neyrojasj/smart-agent"
Repository = "https://github.com/neyrojasj/smart-agent"
